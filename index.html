<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>經管及事業部會議紀錄產生器</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05194a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="會議紀錄">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>body{margin:0}[hidden]{display:none!important}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<style>
/* 版面：單欄工作流程，上方輸入逐字稿，下方是可編輯的記錄草稿與下載。紙張感中性色 + 墨藍強調。 */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --fg:#1d232b; --muted:#5d6672; --line:#d9dde3;
  --accent:#23467a; --accent-fg:#ffffff; --accent-soft:#e6edf7;
  --warn:#9a5b00; --warn-bg:#fff3dc; --ok:#1c6b45; --ok-bg:#e3f4ea; --err:#a3221f; --err-bg:#fde8e7;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181d; --panel:#1c2229; --fg:#e8ebef; --muted:#9aa4b0; --line:#323b45;
  --accent:#8db2ee; --accent-fg:#0f1722; --accent-soft:#222d3d;
  --warn:#f0b866; --warn-bg:#3a2d17; --ok:#7fd0a3; --ok-bg:#183024; --err:#f09a96; --err-bg:#3b1f1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d; --panel:#1c2229; --fg:#e8ebef; --muted:#9aa4b0; --line:#323b45;
  --accent:#8db2ee; --accent-fg:#0f1722; --accent-soft:#222d3d;
  --warn:#f0b866; --warn-bg:#3a2d17; --ok:#7fd0a3; --ok-bg:#183024; --err:#f09a96; --err-bg:#3b1f1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 var(--font);padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-size:24px;line-height:1.3;margin:0 0 4px;font-weight:700;text-wrap:balance}
header p{margin:0;color:var(--muted)}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:17px;margin:0;display:flex;align-items:center;gap:10px;font-weight:700}
h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:13px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;line-height:1.6}
input:focus-visible,textarea:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:500;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 16px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.link{border:none;background:none;color:var(--accent);padding:4px 6px}
.note{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.msg{padding:10px 12px;border-radius:6px;font-size:14px}
.msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.err{background:var(--err-bg);color:var(--err)}
.group{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.group .head{display:flex;gap:8px}
.group .head input{max-width:200px}
.group textarea{background:var(--panel)}
.hl{background:var(--warn-bg);color:var(--warn);border-radius:3px;padding:0 2px}
.meter{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.status{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:120px;overflow:auto}
</style>

<style>
/* 華麗版：深藍漸層主視覺 + 金色點綴 + 卡片陰影 */
:root{--gold:#c9a24b;--gold-soft:#f6ecd3;--navy1:#05194a;--navy2:#23467a;--navy3:#2f6a8f}
body{background:radial-gradient(1200px 500px at 50% -120px,#dfe8f6 0,transparent 70%),var(--bg)}
main{max-width:920px}
header{position:relative;overflow:hidden;border-radius:16px;padding:34px 36px 30px;color:#fff;
  background:linear-gradient(120deg,var(--navy1) 0%,var(--navy2) 55%,var(--navy3) 100%);
  box-shadow:0 18px 40px -18px rgba(20,42,82,.65)}
header::before{content:"";position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,75,.55),transparent 65%)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),#f0d894,var(--gold))}
.eyebrow{font-size:12px;letter-spacing:.32em;color:#f0d894;font-weight:500;margin-bottom:10px}
header h1{font-size:34px;letter-spacing:.06em;color:#fff;margin:0 0 10px;position:relative}
header p{color:#d6e2f5;max-width:34em;position:relative}
.flow{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:relative}
.flow span{font-size:13px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(2px)}
.flow span b{color:#f0d894;margin-right:6px}
section{border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 28px -16px rgba(20,42,82,.35);padding:24px 26px;position:relative}
section::before{content:"";position:absolute;left:26px;top:-1px;width:64px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
h2{font-size:19px;letter-spacing:.04em}
h2 .n{width:30px;height:30px;font-size:15px;background:linear-gradient(135deg,var(--navy2),var(--navy3));color:#fff;box-shadow:0 0 0 3px var(--gold-soft),0 0 0 4px var(--gold)}
.drop{border-color:var(--gold);background:linear-gradient(180deg,#fffdf6,#fbf5e4);color:#7a6126;font-weight:500;padding:22px}
button.primary{background:linear-gradient(135deg,var(--navy2),var(--navy3));border:none;padding:11px 26px;font-size:16px;letter-spacing:.06em;
  box-shadow:0 8px 18px -8px rgba(35,70,122,.8)}
.group{border-left:3px solid var(--gold)}
.badge{background:var(--gold-soft);color:#7a6126}
#s3{background:linear-gradient(180deg,var(--panel),#f4f8fd)}
</style>
<main>
<header>
  <div class="eyebrow">公勝保險經紀人 ・ 花蓮經管團隊</div><h1>經管及事業部會議紀錄產生器</h1>
  <p>貼上或上傳會議逐字稿，整理成一頁的「經管事業部會議記錄」Word 檔，版面沿用公司範本。可安裝到手機，離線也能手動填寫。</p><div class="flow"><span><b>1</b>貼上逐字稿</span><span><b>2</b>檢查修改</span><span><b>3</b>下載 Word</span></div>
</header>

<section id="s1">
  <h2><span class="n">1</span>會議逐字稿</h2>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="選擇或拖曳逐字稿檔案">
    把逐字稿檔案拖到這裡，或點此選擇（txt、srt、vtt、docx）
    <input id="file" type="file" accept=".txt,.srt,.vtt,.md,.docx" hidden>
  </div>
  <div>
    <label for="tr">或直接貼上逐字稿</label>
    <textarea id="tr" rows="8" placeholder="手機錄音轉出的文字貼在這裡。開頭先唸日期、地點、出席名單，表頭會更準。"></textarea>
    <div class="note" id="trcount"></div>
  </div>
  <div>
    <label for="extra">補充資料（選填）：簡報上的績效數字、公基金餘額等，口頭常沒唸全</label>
    <textarea id="extra" rows="3" placeholder="例：8月核發 FYA 達成53%、FYC 達成89%；單位營運基金 2,760 元"></textarea>
  </div>
  <div class="row">
    <button class="primary" id="go">複製提示詞（交給 Claude 整理）</button>
    <button class="link" id="demo">載入範例（10月會議）</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div>
    <label for="back">把 Claude 的回覆貼在這裡，再按「套用」</label>
    <textarea id="back" rows="4" placeholder="到 Claude App 貼上剛才複製的提示詞，等它回覆後，把整段回覆複製回來貼在這裡。"></textarea>
  </div>
  <div class="row"><button class="primary" id="apply">套用到下方記錄</button></div>
</section>

<section id="s2">
  <h2><span class="n">2</span>檢查並修改<span class="badge" id="badge">範例內容</span></h2>
  <div class="msg warn" id="flags" hidden></div>
  <div class="grid">
    <div><label for="date">會議日期</label><input type="text" id="date"></div>
    <div><label for="subject">會議主旨</label><input type="text" id="subject"></div>
    <div><label for="location">地點</label><input type="text" id="location" placeholder="留空＝沿用範本"></div>
    <div><label for="chair">主席</label><input type="text" id="chair" placeholder="留空＝沿用範本"></div>
    <div><label for="recorder">記錄</label><input type="text" id="recorder" placeholder="留空＝沿用範本"></div>
  </div>
  <div><label for="attendees">出席人員</label><input type="text" id="attendees" placeholder="留空＝沿用範本"></div>
  <div><label for="admin">一、行政部分（一行一項）</label><textarea id="admin" rows="3"></textarea></div>
  <div><label for="perf">績效／目標（第一行是標題，其餘每行一條）</label><textarea id="perf" rows="3"></textarea></div>
  <div>
    <label>二、各組重點（每行一項，開頭的「※」程式會自動加）</label>
    <div id="groups" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="row" style="margin-top:8px"><button class="link" id="addg">＋ 新增一組</button></div>
  </div>
  <div><label for="disc">三、各組討論事項</label><input type="text" id="disc"></div>
</section>

<section id="s3">
  <h2><span class="n">3</span>下載 Word</h2>
  <div class="meter"><span id="fit"></span></div>
  <div class="row">
    <button class="primary" id="dl">下載會議記錄 (.docx)</button>
    <span class="note" id="dlnote"></span>
  </div>
  <div class="note">字級會依內容自動從 12pt 縮到 10pt。頁數是預估值，下載後請用 Word 開啟確認；內容偏長時，請回到上一步刪減。</div>
</section>
</main>

<script src="jszip.min.js"></script>
<script>
/* 會議記錄產生核心：範本 docx(JSZip) + content → 新 docx */
const MM = (() => {
  const FONT = '<w:rFonts w:ascii="微軟正黑體" w:hAnsi="微軟正黑體" w:cs="微軟正黑體" w:eastAsia="微軟正黑體"/>';
  const B28 = '<w:rPr><w:rFonts w:eastAsia="微軟正黑體" w:cs="微軟正黑體" w:ascii="微軟正黑體" w:hAnsi="微軟正黑體"/><w:b/><w:bCs/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr>';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const G = [2000, 2000], C = [2000, 330];
  const SIZES = [[24, 400], [22, 380], [22, 360], [21, 350], [20, 330]];

  // 把 content 展開成「版面行」: {text, ind}
  function layout(c) {
    const L = [];
    (c.admin || []).forEach((a, i) => L.push(i === 0 ? { t: '行政部分：\t※ ' + a, ind: G } : { t: '※ ' + a, ind: C }));
    const perf = c.perf || [];
    perf.forEach(l => L.push({ t: l }));
    L.push({ blank: true });
    L.push({ t: '二、經管會議討論事項' });
    (c.groups || []).forEach(([name, items]) => (items || []).forEach((it, i) =>
      L.push(i === 0 ? { t: `  *${name}：\t※ ${it}`, ind: G } : { t: '※ ' + it, ind: C })));
    L.push({ t: c.discussion || '三、經管各組討論事項：(待補)' });
    return L;
  }

  // 估算內容高度(pt)。W=可用寬度(twips)
  const W = 10400;
  function emWidth(s) { let w = 0; for (const ch of s) w += /[\u0000-ÿ]/.test(ch) ? 0.55 : 1; return w; }
  function estimate(c, sz, line) {
    const size = (sz || 24) / 2;
    let lines = 0;
    for (const p of layout(c)) {
      if (p.blank) { lines += 1; continue; }
      const left = p.ind ? p.ind[0] : 0;
      const hang = p.ind ? p.ind[1] : 0;
      const first = (W - (left - hang)) / 20 / size;       // 第一行可放的 em 數
      const rest = (W - left) / 20 / size;
      const t = p.t.replace(/\t/, '　');
      const w = emWidth(t);
      lines += w <= first ? 1 : 1 + Math.ceil((w - first) / rest);
    }
    return { lines, pt: lines * line / 20 };
  }
  const MAXPT = 532; // 380 行高下最多 28 行(實測 29 行已貼底、30 行換頁)

  function para(t, ind, sz, line) {
    const rpr = '<w:rPr>' + FONT + (sz ? `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>` : '<w:szCs w:val="24"/>') + '</w:rPr>';
    let runs = '';
    t.split('\t').forEach((seg, i) => {
      if (i) runs += `<w:r>${rpr}<w:tab/></w:r>`;
      if (seg) runs += `<w:r>${rpr}<w:t xml:space="preserve">${esc(seg)}</w:t></w:r>`;
    });
    const i = ind ? `<w:ind w:left="${ind[0]}" w:hanging="${ind[1]}"/>` : '';
    return '<w:p><w:pPr><w:pStyle w:val="Normal"/><w:tabs><w:tab w:val="clear" w:pos="480"/><w:tab w:val="left" w:pos="1640"/></w:tabs>' +
      `<w:spacing w:lineRule="exact" w:line="${line}"/>${i}<w:jc w:val="both"/><w:rPr>${FONT}<w:szCs w:val="24"/></w:rPr></w:pPr>` + runs + '</w:p>';
  }

  function fill(xml, c, sz, line, P, ps, body) {
    const lay = layout(c);
    const blankPara = P[19];
    const mid = [P[14]];
    lay.forEach(p => mid.push(p.blank ? blankPara : para(p.t, p.ind, sz, line)));
    let out = body.slice(0, ps[14].index) + mid.join('') + body.slice(ps[32].index + ps[32][0].length);
    const withText = (idx, text) => {
      const pp = P[idx].match(/^(<w:p><w:pPr>[\s\S]*?<\/w:pPr>)/)[1];
      const s = out.indexOf(P[idx]); if (s < 0) throw new Error('範本段落找不到 ' + idx);
      out = out.slice(0, s) + pp + `<w:r>${B28}<w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p>` + out.slice(s + P[idx].length);
    };
    withText(13, c.subject || '');
    const m = P[3].match(/^(<w:p>[\s\S]*?<\/w:pPr><w:r><mc:AlternateContent>[\s\S]*?<\/mc:AlternateContent><\/w:r>)/);
    const s = out.indexOf(P[3]);
    out = out.slice(0, s) + m[1] + `<w:r>${B28}<w:t xml:space="preserve">${esc(c.date || '')}</w:t></w:r></w:p>` + out.slice(s + P[3].length);
    if (c.location) withText(4, '地 點 ' + c.location);
    if (c.chair) withText(5, '主 席 ' + c.chair);
    if (c.recorder) withText(6, '記 錄 ' + c.recorder);
    if (c.attendees) withText(9, c.attendees);
    return out;
  }

  async function build(JSZip, tplBytes, c, sz, line) {
    const zip = await JSZip.loadAsync(tplBytes);
    const xml = await zip.file('word/document.xml').async('string');
    const bi = xml.indexOf('<w:body>');
    const head = xml.slice(0, bi), body = xml.slice(bi);
    const ps = [...body.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)];
    if (ps.length !== 34) throw new Error('範本段落數不是 34');
    const P = ps.map(m => m[0]);
    zip.file('word/document.xml', head + fill(xml, c, sz, line, P, ps, body));
    return zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
  }

  function pick(c, maxPt) {   // 回傳第一個放得下的 [sz,line]；都放不下回傳 null
    for (const [sz, line] of SIZES) if (estimate(c, sz, line).pt <= maxPt) return [sz, line];
    return null;
  }
  return { build, estimate, pick, layout, SIZES, MAXPT };
})();
if (false && typeof module !== 'undefined') module.exports = MM;

function setStatus(t){ $('status').textContent=t||''; }
const lines=t=>t.split('\n').map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim());
const strip=s=>s.replace(/^\s*※\s*/,'').trim();

/* ---------- 編輯區 <-> 內容 ---------- */
function groupCard(name,items){
  const d=document.createElement('div'); d.className='group';
  d.innerHTML='<div class="head"><input type="text" class="gn" aria-label="組別名稱"><button class="link rm" type="button">刪除這組</button></div><textarea rows="3" class="gi" aria-label="該組重點"></textarea>';
  d.querySelector('.gn').value=name; d.querySelector('.gi').value=items;
  d.querySelector('.rm').onclick=()=>{d.remove();refresh()};
  d.addEventListener('input',refresh);
  return d;
}
function load(c){
  for(const k of ['date','subject','location','chair','recorder','attendees']) $(k).value=c[k]||'';
  $('admin').value=(c.admin||[]).join('\n');
  $('perf').value=(c.perf||[]).map(s=>s.replace(/^\s+/,'')).join('\n');
  $('disc').value=c.discussion||'三、經管各組討論事項：(待補)';
  $('groups').replaceChildren(...(c.groups||[]).map(([n,i])=>groupCard(n,(i||[]).join('\n'))));
  refresh();
}
function read(){
  const perf=lines($('perf').value).map((s,i)=>i?('  '+s.trim()):s.trim());
  return {
    date:$('date').value.trim(), subject:$('subject').value.trim(),
    location:$('location').value.trim(), chair:$('chair').value.trim(),
    recorder:$('recorder').value.trim(), attendees:$('attendees').value.trim(),
    admin:lines($('admin').value).map(strip), perf,
    groups:[...document.querySelectorAll('.group')].map(g=>[g.querySelector('.gn').value.trim()||'未命名',lines(g.querySelector('.gi').value).map(strip)]).filter(g=>g[1].length),
    discussion:$('disc').value.trim()||'三、經管各組討論事項：(待補)'
  };
}
let timer; 
function refresh(){ clearTimeout(timer); timer=setTimeout(update,150); }
function update(){
  const c=read(), p=MM.pick(c,MM.MAXPT), fit=$('fit');
  const e=MM.estimate(c,22,380);
  if(p){ const [sz]=p; fit.className='msg ok'; fit.textContent=`預估一頁放得下，字級約 ${sz/2}pt（內容約 ${e.lines} 行）`; }
  else{ const over=Math.ceil((MM.estimate(c,20,330).pt-MM.MAXPT)/16.5); fit.className='msg warn'; fit.textContent=`內容偏長，即使縮到 10pt 也可能超過一頁，建議刪減約 ${over} 行`; }
  const f=[]; const all=JSON.stringify(c);
  const nTbc=(all.match(/待確認/g)||[]).length, nTbd=(all.match(/待補/g)||[]).length;
  if(nTbc) f.push(`有 ${nTbc} 處標了「待確認」，請對照簡報或錄音修正，並刪掉標記。`);
  if(nTbd) f.push(`有 ${nTbd} 處標了「待補」，逐字稿沒有提到，請補上或保留。`);
  const fl=$('flags'); fl.hidden=!f.length; fl.textContent=f.join(' ');
}

/* ---------- 讀檔 ---------- */
function cleanSub(t){
  return t.replace(/^WEBVTT.*$/m,'').split('\n').filter(l=>!/^\s*\d+\s*$/.test(l)&&!/-->/.test(l)).join('\n').replace(/\n{3,}/g,'\n\n');
}
async function readFile(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.docx')){
    const z=await JSZip.loadAsync(await f.arrayBuffer());
    const x=await z.file('word/document.xml').async('string');
    return x.replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  }
  let t=await f.text();
  return (n.endsWith('.srt')||n.endsWith('.vtt'))?cleanSub(t):t;
}
async function takeFile(f){
  if(!f)return;
  try{ $('tr').value=await readFile(f); setStatus(`已讀入 ${f.name}`); countTr(); }
  catch(e){ setStatus('讀不到這個檔案，請改用貼上文字。'); }
}
const drop=$('drop');
drop.onclick=()=>$('file').click();
drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();} };
$('file').onchange=e=>takeFile(e.target.files[0]);
['dragenter','dragover'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(v=>drop.addEventListener(v,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>takeFile(e.dataTransfer.files[0]));
const LIMIT=80000;
function countTr(){ const n=$('tr').value.length; $('trcount').textContent=n?`${n.toLocaleString()} 字`+(n>LIMIT?`，超過 ${LIMIT.toLocaleString()} 字的部分不會送出，請分段處理`:''):''; }
$('tr').addEventListener('input',countTr);

{
 "date": "115 年 10 月 2 日",          // 民國年，格式固定，如逐字稿沒提到日期就填 "（待補）"
 "subject": "10月份事業部&經管會議",
 "location": "", "chair": "", "recorder": "", "attendees": "",   // 逐字稿有明確提到才填，否則給空字串
 "admin": ["法遵宣導：…", "…"],        // 一、單位主管重要事項（行政部分），每項一句
 "perf": ["※8月核發/9月受理花蓮績效：", "FYA 達成…　FYC 達成…", "3C實動人力 …　行投使用率…"],   // 第一行是標題，其餘為數字行
 "groups": [["訓練組", ["…"]], ["組發組", ["…"]], ["業推組", ["…"]], ["資訊組", ["…"]], ["總務組", ["…"]]],  // 沒講到的組別直接省略
 "discussion": "三、經管各組討論事項：(待補)"   // 有明確討論結論才改寫，否則維持這句
}

規則：
1. 只寫逐字稿與補充資料裡真的有的內容，不要編造。金額、百分比、人數、日期照原話。
2. 聽不清楚、前後矛盾或你不確定的數字、人名，在該句句尾加「【待確認】」。
3. 人名用這份名單校正同音字：${NAMES}。名單以外的人名保留原樣並加「【待確認】」。
4. 每項盡量一行（約 35 個中文字內），整份要能放進一頁：所有項目合計不超過 22 項。細節只留結論、日期、金額、名單。
5. 標點用全形，不要在項目開頭加「※」或編號。
6. 沒有資料的欄位（例如公基金餘額）不要硬寫。

【補充資料】
${extra||'（無）'}

【逐字稿】
${tr.slice(0,LIMIT)}`;
}
function parseJson(t){
  const a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw new Error('no json');
  const o=JSON.parse(t.slice(a,b+1));
  o.admin=(o.admin||[]).map(String); o.perf=(o.perf||[]).map(String);
  o.groups=(o.groups||[]).map(g=>[String(g[0]),(g[1]||[]).map(String)]);
  return o;
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.append(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}
$('go').onclick=async()=>{
  const tr=$('tr').value.trim();
  if(tr.length<30){ setStatus('逐字稿太短，請先貼上或上傳會議逐字稿。'); return; }
  const ok=await copyText(prompt(tr,$('extra').value.trim()));
  setStatus(ok?'提示詞已複製。請打開 Claude App，貼上送出，等回覆後複製整段回覆，回來貼在下方。':'無法自動複製，請改用較新的瀏覽器。');
};
$('apply').onclick=()=>{
  try{ load(parseJson($('back').value)); $('badge').textContent='Claude 整理的草稿';
    setStatus('已套用。請在第 2 步核對內容，特別是標了「待確認」的地方。'); $('s2').scrollIntoView({behavior:'smooth',block:'start'}); }
  catch(e){ setStatus('讀不到內容，請確認貼上的是 Claude 回覆的完整 JSON（從 { 開始到 } 結束）。'); }
};

/* ---------- 產生 Word ---------- */
function fname(c){
  const m=(c.date||'').match(/(\d+)\s*年\s*(\d+)\s*月/);
  return m?`經管事業部會議記錄-${m[1]}_${m[2]}.docx`:'經管事業部會議記錄.docx';
}
$('dl').onclick=async()=>{
  const c=read();
  if(!c.date||!c.subject){ $('dlnote').textContent='請先填會議日期與主旨'; return; }
  try{
    const bin=Uint8Array.from(atob(TPL_B64),ch=>ch.charCodeAt(0));
    const [sz,line]=MM.pick(c,MM.MAXPT)||MM.SIZES[MM.SIZES.length-1];
    const out=await MM.build(JSZip,bin,c,sz,line);
    const url=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}));
    const a=document.createElement('a'); a.href=url; a.download=fname(c); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    $('dlnote').textContent='已產生 '+fname(c);
  }catch(e){ $('dlnote').textContent='產生失敗，請檢查內容後再試'; }
};
